name: Drizzle Compatibility

on:
  # Run on PRs and pushes to main
  pull_request:
    branches: [main]
  push:
    branches: [main]

  # Run daily to catch new Drizzle releases
  schedule:
    - cron: '0 6 * * *' # 6 AM UTC daily

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      drizzle_version:
        description: 'Specific drizzle-orm version to test (e.g., 0.45.0)'
        required: false
        type: string

jobs:
  # Test against versions in our compatibility matrix
  test-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drizzle-version: [
          '0.44.0',
          '0.44.1',
          '0.45.0',
          '0.45.1',
          '0.45.2',
          '0.45.3',
        ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Update drizzle-orm to ${{ matrix.drizzle-version }}
        run: |
          # Update the import map to use the specific version
          sed -i 's/"drizzle-orm": "npm:drizzle-orm@[^"]*"/"drizzle-orm": "npm:drizzle-orm@${{ matrix.drizzle-version }}"/' deno.jsonc
          cat deno.jsonc | grep drizzle-orm

      - name: Clear Deno cache
        run: deno cache --reload packages/core/tests/drizzle_compat_test.ts

      - name: Run compatibility tests
        run: deno test -P packages/core/tests/drizzle_compat_test.ts
        env:
          DRIZZLE_TEST_VERSION: ${{ matrix.drizzle-version }}

  # Test against latest release
  test-latest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Get latest drizzle-orm version
        id: latest
        run: |
          LATEST=$(npm view drizzle-orm version)
          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Latest drizzle-orm version: $LATEST"

      - name: Update to latest drizzle-orm
        run: |
          sed -i 's/"drizzle-orm": "npm:drizzle-orm@[^"]*"/"drizzle-orm": "npm:drizzle-orm@${{ steps.latest.outputs.version }}"/' deno.jsonc
          cat deno.jsonc | grep drizzle-orm

      - name: Clear Deno cache
        run: deno cache --reload packages/core/tests/drizzle_compat_test.ts

      - name: Run compatibility tests against latest
        run: deno test -P packages/core/tests/drizzle_compat_test.ts
        env:
          DRIZZLE_TEST_VERSION: ${{ steps.latest.outputs.version }}

  # Test specific version if manually triggered
  test-specific:
    runs-on: ubuntu-latest
    if: github.event.inputs.drizzle_version != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Update to drizzle-orm@${{ github.event.inputs.drizzle_version }}
        run: |
          sed -i 's/"drizzle-orm": "npm:drizzle-orm@[^"]*"/"drizzle-orm": "npm:drizzle-orm@${{ github.event.inputs.drizzle_version }}"/' deno.jsonc
          cat deno.jsonc | grep drizzle-orm

      - name: Clear Deno cache
        run: deno cache --reload packages/core/tests/drizzle_compat_test.ts

      - name: Run compatibility tests
        run: deno test -P packages/core/tests/drizzle_compat_test.ts
        env:
          DRIZZLE_TEST_VERSION: ${{ github.event.inputs.drizzle_version }}

  # Check for new Drizzle releases and alert if untested
  check-new-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    # The default GITHUB_TOKEN is read-only; creating the alert issue needs issues:write
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest drizzle-orm version
        id: latest
        run: |
          LATEST=$(npm view drizzle-orm version)
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Check if version is in our matrix
        id: check
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          if jq -e ".tested | index(\"$LATEST\")" drizzle-compat.json > /dev/null; then
            echo "status=tested" >> $GITHUB_OUTPUT
            echo "✓ Version $LATEST is already in our test matrix"
          else
            echo "status=new" >> $GITHUB_OUTPUT
            echo "⚠ Version $LATEST is NOT in our test matrix"
          fi

      - name: Create issue for new version
        if: steps.check.outputs.status == 'new'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.latest.outputs.version }}';
            const title = `🔄 New Drizzle release: drizzle-orm@${version}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'drizzle-compat'
            });

            const existingIssue = issues.data.find(i => i.title.includes(version));
            if (existingIssue) {
              console.log(`Issue already exists: #${existingIssue.number}`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: `A new version of drizzle-orm (${version}) has been released.\n\n` +
                    `## Action Required\n\n` +
                    `1. Run the compatibility tests manually:\n` +
                    `   - Go to Actions → Drizzle Compatibility → Run workflow\n` +
                    `   - Enter version: \`${version}\`\n\n` +
                    `2. If tests pass, update:\n` +
                    `   - \`drizzle-compat.json\`: Add to "tested" array\n` +
                    `   - \`deno.jsonc\`: Update the drizzle-orm import\n\n` +
                    `3. If tests fail, investigate the breaking changes.\n\n` +
                    `[View drizzle-orm changelog](https://github.com/drizzle-team/drizzle-orm/releases)`,
              labels: ['drizzle-compat', 'dependencies']
            });

            console.log(`Created issue for drizzle-orm@${version}`);
